name: Screenshot passive events diagnostic (not acceptance)
on:
  push:
    branches: ['diagnostics/screenshot-events-20261117-2000']
permissions:
  contents: read
concurrency:
  group: screenshot-events-diagnostic-20261117-2000
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      TIMELINE_BASE_PATH: ''
      TIMELINE_OUT_DIR: dist
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 012ce7acb7b438653acf679323d7fc8e1f824c49
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check pure diagnostic contracts
        run: node --test harness/tests/screenshot-events-diagnostic.test.mjs
      - name: Install locked source, supported browser and offline image decoder
        run: |
          npm ci --prefix candidate
          cd candidate
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk python3-pil
      - name: Check offline pixel decoder contracts
        run: /usr/bin/python3 -B harness/tests/screenshot-events-pixels.test.py
      - name: Record provenance
        run: |
          mkdir -p screenshot-events-evidence
          {
            node --version
            npm --version
            uname -a
            lscpu
            cat /proc/self/cgroup
            dpkg-query -W fonts-noto-cjk python3-pil
            /usr/bin/python3 -c "import sys,PIL; print(sys.executable, PIL.__version__)"
            cd candidate
            git rev-parse HEAD 'HEAD^{tree}'
            npm ls @playwright/test playwright playwright-core
            npx playwright install --list
          } > screenshot-events-evidence/provenance.txt 2>&1
      - name: Build exact Wallet once, not full acceptance
        run: npm run build --prefix candidate
      - name: Original and event-only N E E N diagnostic
        run: node harness/scripts/screenshot-events-diagnostic.mjs "$GITHUB_WORKSPACE"
      - name: Preserve numerical observations separately
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshot-events-numerical-${{ github.sha }}
          path: |
            screenshot-events-evidence/manifest.json
            screenshot-events-evidence/provenance.txt
            screenshot-events-evidence/pixel-comparison.json
            screenshot-events-evidence/*/results.json
            screenshot-events-evidence/*/inventory.json
            screenshot-events-evidence/*/runtime-diagnostics.ndjson
            screenshot-events-evidence/*/diagnostic.config.mts
            screenshot-events-evidence/*/listing.*.txt
            screenshot-events-evidence/*/observations.json
            screenshot-events-evidence/*/artifacts/**/screenshot-events.json
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve all observations and all original screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshot-events-full-${{ github.sha }}
          path: screenshot-events-evidence/
          retention-days: 7
          if-no-files-found: warn
