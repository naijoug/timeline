name: Paired browser diagnostic (not acceptance)
on:
  push:
    branches: ['diagnostics/paired-browser-20261116-2000']
permissions:
  contents: read
concurrency:
  group: paired-browser-diagnostic-20261116-2000
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      TIMELINE_BASE_PATH: ''
      TIMELINE_OUT_DIR: dist
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: aa79d2115c73067e34b51527585a2b321da11cd1
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 012ce7acb7b438653acf679323d7fc8e1f824c49
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check diagnostic contracts only
        run: node --test harness/tests/paired-browser-diagnostic.test.mjs
      - name: Install the two exact locked sources
        run: |
          npm ci --prefix baseline
          npm ci --prefix candidate
          cd baseline
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Preserve runner and package provenance
        run: |
          mkdir -p paired-diagnostic-evidence
          {
            node --version
            npm --version
            uname -a
            lscpu
            cat /proc/self/cgroup
            for path in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu.stat /proc/pressure/cpu /proc/pressure/memory /proc/pressure/io; do
              echo "$path"
              cat "$path" || true
            done
            dpkg-query -W fonts-noto-cjk
            cd baseline
            git rev-parse HEAD 'HEAD^{tree}'
            npm ls @playwright/test playwright playwright-core
            npx playwright install --list
            cd ../candidate
            git rev-parse HEAD 'HEAD^{tree}'
            npm ls @playwright/test playwright playwright-core
          } > paired-diagnostic-evidence/provenance.txt 2>&1
      - name: Build each exact source, not release acceptance
        run: |
          npm run build --prefix baseline
          npm run build --prefix candidate
      - name: Four-case A-B-B-A timing and separate A-B trace explanation
        run: node harness/scripts/paired-browser-diagnostic.mjs "$GITHUB_WORKSPACE"
      - name: Preserve all diagnostic observations, including failures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: paired-diagnostic-${{ github.sha }}
          path: paired-diagnostic-evidence/
          retention-days: 7
          if-no-files-found: warn
