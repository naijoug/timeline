name: Subtimeline checks
on:
  pull_request:
    branches: [main]
  # Candidate pushes support the owner's no-PR workflow; this never deploys.
  push:
    branches: ['maintenance/**']
permissions:
  contents: read
concurrency:
  group: subtimeline-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    # Playwright 1.57 supports Ubuntu 24.04; ubuntu-latest may move to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and CJK fallback fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Validate source and root build
        run: npm run check && npm test && npm run build && npm run check:links && npm run check:reading && npm run check:subtimelines && npm run check:performance && npm run test:hydration
      - name: Root browser acceptance
        run: npm run test:browser
      - name: Validate Pages build
        env:
          TIMELINE_BASE_PATH: /timeline
          TIMELINE_OUT_DIR: dist-pages
        run: npm run build && npm run check:links && npm run check:reading && npm run check:subtimelines && npm run check:performance && npm run test:hydration
      - name: Pages browser acceptance
        env:
          TIMELINE_BASE_PATH: /timeline
          TIMELINE_OUT_DIR: dist-pages
        run: npm run test:browser
      # Keep each base-path archive below connector download limits as the suite grows.
      - name: Keep root browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: subtimeline-browser-root-${{ github.sha }}
          path: test-results/browser-root/
          retention-days: 7
          if-no-files-found: warn
      - name: Keep Pages browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: subtimeline-browser-pages-${{ github.sha }}
          path: test-results/browser-pages/
          retention-days: 7
          if-no-files-found: warn
