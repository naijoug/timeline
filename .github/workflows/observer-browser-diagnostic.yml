name: Observer browser diagnostic (not acceptance)
on:
  push:
    branches: ['diagnostics/observer-browser-20261117-0000']
permissions:
  contents: read
concurrency:
  group: observer-browser-diagnostic-20261117-0000
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      TIMELINE_BASE_PATH: ''
      TIMELINE_OUT_DIR: dist
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 012ce7acb7b438653acf679323d7fc8e1f824c49
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check diagnostic contracts
        run: node --test harness/tests/observer-browser-diagnostic.test.mjs
      - name: Install exact locked source and browser
        run: |
          npm ci --prefix candidate
          cd candidate
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Record provenance
        run: |
          mkdir -p observer-diagnostic-evidence
          {
            node --version
            npm --version
            uname -a
            lscpu
            cat /proc/self/cgroup
            dpkg-query -W fonts-noto-cjk
            cd candidate
            git rev-parse HEAD 'HEAD^{tree}'
            npm ls @playwright/test playwright playwright-core
            npx playwright install --list
          } > observer-diagnostic-evidence/provenance.txt 2>&1
      - name: Build exact Wallet once, not acceptance
        run: npm run build --prefix candidate
      - name: Twelve-case N-R-R-N observer comparison
        run: node harness/scripts/observer-browser-diagnostic.mjs "$GITHUB_WORKSPACE"
      - name: Preserve all observations, including incomplete evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: observer-diagnostic-${{ github.sha }}
          path: observer-diagnostic-evidence/
          retention-days: 7
          if-no-files-found: warn
