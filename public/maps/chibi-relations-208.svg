<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc">
<title id="title">赤壁之战：隔岸、火攻与战后去向</title>
<desc id="desc">依周瑜传正文整理的三窗原创关系示意。三窗独立、非按比例、不作坐标对齐。箭头是关联或叙事次序，不是实际道路。武帝纪正文与裴注异文另见读图要点。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#333"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#222}.title{font-size:30px;font-weight:700}.stage{font-size:28px;font-weight:700}.label{font-size:27px}.note{font-size:23px;fill:#505050}.small{font-size:21px;fill:#505050}.panel{fill:#fafafa;stroke:#bbb;stroke-width:2}.node{fill:#fff;stroke:#777;stroke-width:2}.line{fill:none;stroke:#333;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="640" height="1080" fill="white"/>
<text x="32" y="48" class="title">赤壁 · 隔岸、火攻与战后去向</text>
<text x="32" y="86" class="note">208年背景 · 依《周瑜传》正文整理</text>
<rect x="24" y="112" width="592" height="282" rx="10" class="panel"/>
<text x="44" y="153" class="stage">① 初战之后 · 只示相对岸位</text>
<text x="44" y="208" class="label">江北：曹军</text>
<rect x="44" y="231" width="552" height="40" fill="#e8e8e8"/>
<text x="320" y="259" text-anchor="middle" class="small">江（水带不示河形或流向）</text>
<text x="44" y="316" class="label">南岸：周瑜等</text>
<text x="44" y="369" class="small">不是现代赤壁定位，也不是营地坐标</text>
<rect x="24" y="414" width="592" height="238" rx="10" class="panel"/>
<text x="44" y="455" class="stage">② 黄盖火攻 · 火势关联</text>
<rect x="44" y="483" width="180" height="62" rx="5" class="node"/><text x="134" y="525" text-anchor="middle" class="label">船舰</text>
<path d="M239 514H375" class="line"/><text x="308" y="497" text-anchor="middle" class="small">延烧</text>
<rect x="392" y="483" width="204" height="62" rx="5" class="node"/><text x="494" y="525" text-anchor="middle" class="label">岸上营落</text>
<text x="44" y="589" class="note">箭头不是舰船航线或风向</text>
<text x="44" y="626" class="small">不据注引细节重建距离、阵形和兵数</text>
<rect x="24" y="672" width="592" height="278" rx="10" class="panel"/>
<text x="44" y="713" class="stage">③ 战后去向 · 分开地区与城</text>
<text x="44" y="766" class="label">曹军退保南郡（地区）</text>
<path d="M74 786V822" class="line"/><text x="104" y="815" class="small">叙事次序，不是道路</text>
<text x="44" y="863" class="label">曹仁留守江陵（城）；曹操北归</text>
<text x="44" y="916" class="small">后续南郡争夺不压缩成同日战场</text>
<text x="32" y="991" class="note">三窗独立 · 非按比例 · 不作坐标对齐</text>
<text x="32" y="1028" class="small">武帝纪正文、裴注异文另见读图要点</text>
<text x="32" y="1060" class="small">不串联华容道、合肥为确定行军线</text>
</svg>
